<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>我的手机不可能这么多广告！？</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Press Start 2P', 'Microsoft YaHei', 'PingFang SC',
          'Noto Sans CJK SC', monospace, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
        background: #000;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #app canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        background: #000;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
